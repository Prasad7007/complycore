server {
    listen 80;
    server_name _;

    client_max_body_size 100m;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy all API requests to the api container (internal Docker network).
    # Use resolver + variable so nginx re-resolves 'api' after the API container is recreated
    # (otherwise upstream IP is cached at nginx start → 502 Connection refused).
    # SSE (Server-Sent Events) streams — must NOT clear Connection header.
    location ~ ^/api/.*/(comments/stream|notifications/stream)$ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api:8052;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "keep-alive";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600;
        chunked_transfer_encoding off;
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api:8052;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /email/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}