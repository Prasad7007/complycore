name: Unified CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  migration-dry-run-gate:
    name: Schema Dry-Run
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ai_compliance
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Migration Requirements
        working-directory: ./AI Compliance
        run: |
          pip install -r requirements_migrations.txt

      - name: Run alembic dry-run upgrade to head
        working-directory: ./AI Compliance
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ai_compliance"
        run: |
          alembic upgrade head

  integration-tests-gate:
    name: Integration & Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ai_compliance
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./AI Compliance
        run: |
          pip install -r requirements_api.txt
          pip install -r requirements_migrations.txt
          pip install pytest pytest-asyncio

      - name: Run alembic migrations upgrade
        working-directory: ./AI Compliance
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ai_compliance"
        run: |
          alembic upgrade head

      - name: Execute pytest integration suite
        working-directory: ./AI Compliance
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ai_compliance"
          DEMO_LOGIN_ENABLED: "true"
          DEMO_LOGIN_PASSWORD: "password123"
          DEMO_LOGIN_EMAILS: "marketing@company.com,sme@company.com,compliance@company.com,superadmin@company.com,profile@company.com"
          AWS_REGION: "ca-central-1"
          COGNITO_USER_POOL_ID: "ca-central-1_0HIGcGhSi"
          COGNITO_APP_CLIENT_ID: "2km0d23vn66pf6hftpalnq86a2"
          PYTHONPATH: .
        run: |
          pytest tests/ci/

  deploy-uat:
    name: Deploy to UAT Server
    runs-on: ubuntu-latest
    needs: [migration-dry-run-gate, integration-tests-gate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.UAT_SSH_KEY }}

      - name: Deploy to UAT Server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.UAT_USER }}@${{ secrets.UAT_HOST }} << 'EOF'
            set -e
            cd ~/compliance_ai

            # One image at a time so worker (Torch/LibreOffice) cannot OOM the host.
            export COMPOSE_PARALLEL_LIMIT=1
            export DOCKER_BUILDKIT=1

            # Capture both local HEAD and origin/main *before* fetch.
            # Diffing only local HEAD is wrong when the checkout diverged from
            # origin (manual rebuilds, repo migration, etc.) and can produce an
            # empty file list → skipped image builds.
            PREV_SHA=$(git rev-parse HEAD 2>/dev/null || echo "")
            OLD_ORIGIN=$(git rev-parse origin/main 2>/dev/null || echo "")
            echo "Current running Git SHA: $PREV_SHA"
            echo "origin/main before fetch: $OLD_ORIGIN"

            git fetch origin
            git reset --hard origin/main
            NEW_SHA=$(git rev-parse HEAD)
            echo "Deploying Git SHA: $NEW_SHA"

            echo "Pruning Docker build cache older than 7 days..."
            docker builder prune -af --filter until=168h
            docker image prune -f

            BUILD_SERVICES=""
            CHANGED=""
            DIFF_BASE=""

            if [ -z "$NEW_SHA" ]; then
              echo "ERROR: could not resolve new HEAD; rebuilding all images."
              BUILD_SERVICES="api frontend worker"
            elif [ -n "$OLD_ORIGIN" ] && [ "$OLD_ORIGIN" != "$NEW_SHA" ]; then
              DIFF_BASE="$OLD_ORIGIN"
            elif [ -n "$PREV_SHA" ] && [ "$PREV_SHA" != "$NEW_SHA" ]; then
              DIFF_BASE="$PREV_SHA"
            elif [ -z "$PREV_SHA" ] && [ -z "$OLD_ORIGIN" ]; then
              echo "No previous SHA; rebuilding all images."
              BUILD_SERVICES="api frontend worker"
            else
              echo "Same SHA as before ($NEW_SHA); no image rebuild required."
            fi

            if [ -n "$DIFF_BASE" ]; then
              if ! git cat-file -e "${DIFF_BASE}^{commit}" 2>/dev/null; then
                echo "Diff base $DIFF_BASE not in local history; rebuilding all images."
                BUILD_SERVICES="api frontend worker"
              else
                CHANGED=$(git diff --name-only "$DIFF_BASE" "$NEW_SHA" || true)
                echo "Diff base: $DIFF_BASE -> $NEW_SHA"
                echo "Changed files:"
                echo "$CHANGED"

                if [ -z "$(echo "$CHANGED" | tr -d '[:space:]')" ]; then
                  # Different commits but empty tree diff is suspicious
                  # (unrelated/migrated history). Rebuild everything.
                  echo "WARNING: SHAs differ but file diff is empty; rebuilding all images."
                  BUILD_SERVICES="api frontend worker"
                elif echo "$CHANGED" | grep -qE '^docker-compose\.yml$'; then
                  BUILD_SERVICES="api frontend worker"
                else
                  if echo "$CHANGED" | grep -qE '^full-frontend/'; then
                    BUILD_SERVICES="$BUILD_SERVICES frontend"
                  fi
                  if echo "$CHANGED" | grep -qE '^AI Compliance/'; then
                    BUILD_SERVICES="$BUILD_SERVICES api worker"
                  fi
                  # Workflow-only / docs-only changes correctly skip rebuilds.
                fi
              fi
            fi

            BUILD_SERVICES=$(echo $BUILD_SERVICES | xargs)
            if [ -n "$BUILD_SERVICES" ]; then
              echo "Building services (sequential): $BUILD_SERVICES"
              docker-compose build $BUILD_SERVICES
            else
              echo "No image rebuild required; reusing existing images."
            fi

            echo "Running database migrations..."
            docker-compose run --no-deps --rm api alembic upgrade head

            echo "Starting all containers..."
            docker-compose up -d --no-build --force-recreate --remove-orphans

            HEALTH_URL="http://localhost:8052/api/v1/health"
            POLLS=30
            SUCCESS=false

            echo "Waiting for health check validation..."
            for i in $(seq 1 $POLLS); do
              HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 3 "$HEALTH_URL" || echo "000")

              if [ "$HTTP_STATUS" = "200" ]; then
                echo "Health check passed! HTTP 200."
                SUCCESS=true
                break
              else
                echo "Health status: $HTTP_STATUS. Checking again in 2 seconds... (Attempt $i/$POLLS)"
                sleep 2
              fi
            done

            if [ "$SUCCESS" = false ]; then
              echo "Deploy failed health check! Initiating auto-rollback..."
              if [ -n "$PREV_SHA" ]; then
                git reset --hard "$PREV_SHA"
                if [ -n "$BUILD_SERVICES" ]; then
                  docker-compose build $BUILD_SERVICES
                fi
                docker-compose up -d --no-build --force-recreate --remove-orphans
                echo "Rollback to commit $PREV_SHA completed."
              else
                echo "No previous commit found to rollback to."
              fi
              exit 1
            fi
          EOF
