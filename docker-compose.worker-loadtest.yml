# Fully local worker-capacity stack: no API auth, RDS, AWS S3, or loadtest .env.
services:
  loadtest-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: complycore_loadtest
      POSTGRES_USER: loadtest
      POSTGRES_PASSWORD: loadtest-only-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loadtest -d complycore_loadtest"]
      interval: 5s
      timeout: 5s
      retries: 20

  loadtest-redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  loadtest-s3mock:
    image: adobe/s3mock:5.1.0
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/favicon.ico"]
      interval: 5s
      timeout: 3s
      retries: 20

  loadtest-worker:
    build:
      context: "./AI Compliance"
      dockerfile: Dockerfile.worker
      args:
        INSTALL_MIGRATION_TOOLS: "true"
    environment:
      APP_ENV: loadtest
      DATABASE_URL: postgresql://loadtest:loadtest-only-password@loadtest-db:5432/complycore_loadtest
      REDIS_URL: redis://loadtest-redis:6379/0
      AWS_ACCESS_KEY_ID: loadtest-access-key
      AWS_SECRET_ACCESS_KEY: local-loadtest-only-secret
      AWS_REGION: us-east-1
      AWS_S3_BUCKET: complycore-loadtest
      S3_ENDPOINT_URL: http://loadtest-s3mock:9090
      LOAD_TEST_STUB_LLM: "true"
      LOAD_TEST_STUB_LLM_DELAY_SEC: "1.5"
      CELERY_MAX_TASKS_PER_CHILD: "10"
      CELERY_VISIBILITY_TIMEOUT: "3600"
    depends_on:
      loadtest-db:
        condition: service_healthy
      loadtest-redis:
        condition: service_healthy
      loadtest-s3mock:
        condition: service_healthy
    command:
      - python
      - -m
      - celery
      - -A
      - apis.services.celery_app
      - worker
      - --loglevel=info
      - --concurrency=${WORKER_CONCURRENCY:-2}
    mem_limit: ${WORKER_MEMORY_LIMIT:-4g}

  worker-capacity:
    build:
      context: "./AI Compliance"
      dockerfile: Dockerfile.worker
      args:
        INSTALL_MIGRATION_TOOLS: "true"
    environment:
      APP_ENV: loadtest
      DATABASE_URL: postgresql://loadtest:loadtest-only-password@loadtest-db:5432/complycore_loadtest
      REDIS_URL: redis://loadtest-redis:6379/0
      AWS_ACCESS_KEY_ID: loadtest-access-key
      AWS_SECRET_ACCESS_KEY: local-loadtest-only-secret
      AWS_REGION: us-east-1
      AWS_S3_BUCKET: complycore-loadtest
      S3_ENDPOINT_URL: http://loadtest-s3mock:9090
      LOAD_TEST_STUB_LLM: "true"
      LOAD_TEST_STUB_LLM_DELAY_SEC: "1.5"
    depends_on:
      loadtest-db:
        condition: service_healthy
      loadtest-redis:
        condition: service_healthy
      loadtest-s3mock:
        condition: service_healthy
    volumes:
      - ./loadtest/worker_capacity.py:/loadtest/worker_capacity.py:ro
      - ./loadtest/reports:/loadtest/reports
    command:
      - python
      - /loadtest/worker_capacity.py
